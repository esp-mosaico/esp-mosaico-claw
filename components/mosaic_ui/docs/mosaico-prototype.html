<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mosaico · 完整原型（初始化 + 系统功能）</title>
<style>
/* ============================================================
   马赛克 Mosaico · 完整可交互原型
   模块一 初始化：Figma 5fSPBpBpPHCv9TaWwriol3 / 535-6042
   模块二 系统功能：Figma eX2WRcGWccITkuXHznCX5i / 1-870
   屏幕 480×480 · 外壳 534×561（544:6674）
   ============================================================ */
:root{
  --brand-red:#E8362D; --orange:#EB4126;
  --btn-default:#FF4C01; --btn-active:#E64501;
  --btn-disabled:#892C07; --btn-disabled-text:#91919B;
  --white:#FFFFFF; --black:#0D0D0D; --bg-dark:#000000;
  --gray-0:#F9FAFB; --gray-1:#EDEFF2; --gray-2:#E1E4E9; --gray-3:#B4B6BA;
  --gray-4:#909295; --gray-5:#3B3C3D; --gray-6:#181819; --gray-7:#0D0D0D;
  --text-white:rgba(252,252,255,.90); --text-white-solid:#FCFCFF;
  --text-secondary:#91919B; --text-tertiary:#D6D6DE;
  --err:#FF0000; --warn:#FDA711; --ok:#63C270;
  --r-screen:60px; --r-page:40px; --r-card-l:24px; --r-card-s:16px;
  --r-btn:12px; --r-icon:8px; --r-chip:999px;
  --kb-x:19.42px; --kb-w:441.16px; --kb-key:35.32px; --kb-h:47.95px; --kb-gap:9.77px;
  --ease-overshoot:cubic-bezier(0.34,1.56,0.64,1);
  --ease-suck:cubic-bezier(0.55,-0.12,0.65,1);
  --ease-pop:cubic-bezier(0.3,1.3,0.5,1);
  --ease-push:cubic-bezier(0.3,1.1,0.5,1);
  /* 本机装有授权字体时走 MNE/HN；缺失时退到同类无衬线体，避免掉进衬线默认字体。
     待嵌入字体文件后，后备栈可去掉。 */
  --font-display:'MNE','Helvetica Neue','Segoe UI',Arial,sans-serif;   /* Maison Neue Ext */
  --font-text:'HN','Helvetica Neue','Segoe UI',Arial,sans-serif;       /* Helvetica Neue */
}
/* 本机已装授权字体，显式绑定字重，不做降级 */
@font-face{font-family:'MNE';font-weight:300;font-display:block;
  src:local('Maison Neue Ext Light'),local('MaisonNeueExt-Light'),local('Maison Neue Extended Light'),local('Maison Neue Ext Book'),local('Maison Neue Ext');}
@font-face{font-family:'MNE';font-weight:400;font-display:block;
  src:local('Maison Neue Ext Book'),local('MaisonNeueExt-Book'),local('Maison Neue Extended Book'),local('Maison Neue Ext'),local('MaisonNeueExt');}
@font-face{font-family:'MNE';font-weight:500;font-display:block;
  src:local('Maison Neue Ext Medium'),local('MaisonNeueExt-Medium'),local('Maison Neue Extended Medium'),local('Maison Neue Ext');}
@font-face{font-family:'MNE';font-weight:600;font-display:block;
  src:local('Maison Neue Ext Demi'),local('MaisonNeueExt-Demi'),local('Maison Neue Ext SemiBold'),local('Maison Neue Ext');}
@font-face{font-family:'HN';font-weight:300;font-display:block;
  src:local('Helvetica Neue Light'),local('HelveticaNeue-Light'),local('HelveticaNeueLight'),local('Helvetica Neue');}
@font-face{font-family:'HN';font-weight:400;font-display:block;
  src:local('Helvetica Neue'),local('HelveticaNeue'),local('Helvetica Neue Regular'),local('HelveticaNeue-Roman');}

/* ============================================================
   字号体系（Figma 文本框宽度反推 + design-system.md §2.2）
   ============================================================ */
.t-h1  {font-family:var(--font-display);font-weight:600;font-size:48px;line-height:1;}
.t-nav {font-size:28px;line-height:1.4;}                       /* 导航栏标题 */
.t-body{font-size:32px;line-height:1.4;}                       /* en-body 列表主文字 */
.t-cap {font-size:24px;line-height:1.4;}                       /* en-caption 副文字 */
.t-sm  {font-size:18px;font-weight:300;line-height:1.4;}       /* en-special2 Light */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{background:#16171A;color:#8A8C90;font-family:var(--font-text);
  display:flex;align-items:flex-start;justify-content:center;gap:28px;padding:32px;overflow:auto;}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;}
.stage-hint{font-size:12px;color:#5C5E63;letter-spacing:.04em;text-align:center;line-height:1.8;}
.stage-hint b{color:#8A8C90;font-weight:500;}
.panel{width:228px;flex:none;font-size:12px;line-height:1.6;}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#5C5E63;margin:18px 0 7px;font-weight:600;}
.panel h3:first-child{margin-top:0;}
.panel button,.panel select{display:block;width:100%;text-align:left;margin-bottom:4px;padding:6px 9px;
  background:#212328;border:1px solid #2C2F35;color:#9A9CA1;border-radius:7px;font:inherit;cursor:pointer;transition:.12s;}
.panel button:hover{background:#2A2D33;color:#D6D6DE;border-color:#3A3E45;}
.panel button.on{background:var(--btn-default);border-color:var(--btn-default);color:#fff;}
.row2{display:flex;gap:6px}.row2 button{text-align:center}
/* 折叠分组 */
.acc{margin-bottom:6px;}
.acc-h{display:flex!important;align-items:center;justify-content:flex-start;gap:8px;
  background:#1C1E22!important;border-color:#2A2D33!important;color:#B4B6BA!important;font-weight:500;}
.acc-h .cnt{margin-left:auto;font-size:10px;color:#5C5E63;background:#262930;
  padding:1px 6px;border-radius:8px;}
.acc-h i{font-style:normal;color:#5C5E63;transition:transform .18s;display:inline-block;}
.acc.open .acc-h i{transform:rotate(90deg);}
.acc.open .acc-h{background:#26282E!important;color:#E4E5E7!important;}
.acc-b{display:none;padding:4px 0 2px 8px;border-left:1px solid #2A2D33;margin-left:6px;}
.acc.open .acc-b{display:block;}
/* 字体自检（设备下方） */
.fontbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;max-width:534px;
  padding:10px 14px;background:#1A1C20;border:1px solid #24272C;border-radius:10px;font-size:11px;}
.fontbar .fb-t{color:#5C5E63;letter-spacing:.1em;text-transform:uppercase;font-weight:600;}
.fontbar #fontCheck{display:flex;gap:12px;flex-wrap:wrap;}
.fontbar #fontCheck span{white-space:nowrap;}
.fontbar #fontFound{flex-basis:100%;color:#4E5055;line-height:1.6;}

/* ---------- 硬件外壳 · Figma 544:6674 ---------- */
.device-wrap{transform-origin:top center;transition:transform .2s ease;}
.device{position:relative;width:534px;height:561px;}
.body-shell{position:absolute;left:0;top:19px;width:534px;height:534px;border-radius:21px;
  background:linear-gradient(160deg,#D2D2D2 0%,#BBBBBB 45%,#A6A6A6 100%);
  box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.5);}
.bezel{position:absolute;left:7px;top:28px;width:520px;height:514px;border-radius:60px;background:#000;}
.screen{position:absolute;left:27.42px;top:45px;width:480px;height:480px;border-radius:60px;
  overflow:hidden;background:#000;isolation:isolate;}
.key{position:absolute;background:var(--btn-default);cursor:pointer;transition:filter .1s,transform .1s;}
.key:active,.key.pressed{filter:brightness(.8);}
.key-top{left:377.42px;top:0;width:92px;height:19px;border-radius:5px 5px 0 0;}
.key-top.pressed{transform:translateY(2px);}
.key-bl{left:41.42px;top:553px;width:103px;height:8px;border-radius:0 0 4px 4px;}
.key-br{left:377.42px;top:553px;width:103px;height:8px;border-radius:0 0 4px 4px;}
.key-bl.pressed,.key-br.pressed{transform:translateY(-2px);}
.glare{position:absolute;inset:0;border-radius:60px;pointer-events:none;z-index:900;
  background:linear-gradient(145deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,0) 42%);}

/* ---------- 屏幕与转场 ---------- */
.view{position:absolute;inset:0;width:480px;height:480px;background:#000;overflow:hidden;
  font-family:var(--font-text);color:var(--text-white);will-change:transform,opacity;}
@keyframes push-in {from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes push-out{from{transform:none;opacity:1}to{transform:translateX(-28px);opacity:0}}
@keyframes pop-in  {from{transform:translateX(-28px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop-out {from{transform:none;opacity:1}to{transform:translateX(48px);opacity:0}}
@keyframes fade-in {from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
@keyframes dlg-in  {from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes dlg-out {from{transform:scale(1);opacity:1}to{transform:scale(.94);opacity:0}}
@keyframes cc-in   {from{transform:translateY(-100%)}to{transform:none}}
@keyframes cc-out  {from{transform:none}to{transform:translateY(-100%)}}
@keyframes lock-out{from{transform:none;opacity:1}to{transform:translateY(-46px) scale(1.08);opacity:0}}
/* 插入通知：从插入的那一侧弹入 */
@keyframes ins-in-r{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes ins-in-l{from{transform:translateX(-100%);opacity:0}to{transform:none;opacity:1}}
/* 整屏位移下过冲会被放大：--ease-overshoot 在 480px 上回弹达 47px，太跳。
   换成弱过冲曲线，峰值 1.0155 → 回弹约 7px，保留一点弹性但不明显 */
.a-ins-r{animation:ins-in-r .36s cubic-bezier(.28,1.22,.45,1) both}
.a-ins-l{animation:ins-in-l .36s cubic-bezier(.28,1.22,.45,1) both}
.a-push-in{animation:push-in .30s var(--ease-push) both}
.a-push-out{animation:push-out .26s ease-in both}
.a-pop-in{animation:pop-in .28s var(--ease-push) both}
.a-pop-out{animation:pop-out .26s ease-in both}
.a-fade-in{animation:fade-in .22s ease both}
.a-fade-out{animation:fade-out .18s ease both}
.a-dlg-in{animation:dlg-in .34s var(--ease-overshoot) both}
.a-dlg-out{animation:dlg-out .18s ease-in both}
.a-cc-in{animation:cc-in .42s var(--ease-overshoot) both}
.a-cc-out{animation:cc-out .34s var(--ease-suck) both}
.a-lock-out{animation:lock-out .22s ease-in both}

/* ============================================================
   模块一 · 初始化
   ============================================================ */
.topbar{position:absolute;left:0;top:0;width:480px;height:64px;padding:8px 24px;
  display:flex;align-items:center;justify-content:space-between;z-index:60;}
.tb-side{display:flex;align-items:center;cursor:pointer;font-size:24px;line-height:1.4;}
.tb-side.hidden{opacity:0;pointer-events:none;}
.tb-skip{color:var(--btn-default);}
.tb-title{font-size:24px;color:var(--text-white-solid);}
.chev{width:48px;height:48px;flex:none;}
.title{position:absolute;left:24px;top:64px;font-family:var(--font-display);
  font-size:48px;font-weight:600;line-height:1;color:var(--text-white-solid);letter-spacing:-.01em;}
.subtitle{position:absolute;left:24px;font-size:24px;line-height:1.4;color:var(--text-secondary);}
.pill{height:88px;padding:14px 40px;border-radius:var(--r-chip);background:var(--gray-5);color:var(--gray-0);
  font-size:32px;line-height:normal;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .12s;user-select:none;}
.pill:active{background:var(--gray-6);}
.pill.off{background:var(--gray-6);color:var(--text-secondary);pointer-events:none;}
.pill.primary{background:var(--btn-default);color:var(--gray-0);}
.pill.primary:active{background:var(--btn-active);}
.pill.primary.off{background:var(--btn-disabled);color:var(--btn-disabled-text);pointer-events:none;}
.skipguide{position:absolute;right:12px;bottom:18px;display:flex;align-items:center;
  font-size:24px;line-height:1.4;color:#909295;cursor:pointer;z-index:60;}
.skipguide svg{margin-left:-10px;}
.scrollbar{position:absolute;left:455px;width:8px;border-radius:4px;background:#5A5A60;z-index:70;transition:opacity .3s;}
.wifi-panel{position:absolute;left:0;top:200px;width:480px;height:350px;
  background:var(--gray-5);border-radius:var(--r-page);overflow:hidden;}
.wifi-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
.wifi-scroll::-webkit-scrollbar{display:none;}
.wifi-row{display:flex;align-items:center;justify-content:space-between;padding:28px 12px;
  border-bottom:1px solid #000;background:var(--gray-5);cursor:pointer;transition:background .1s;}
.wifi-row:active{background:#4A4B4D;}
.wifi-row .ssid{font-size:32px;line-height:1.4;color:#fff;}
.wifi-row .icons{display:flex;align-items:center;gap:8px;}
.wifi-row.other .ssid{color:var(--text-tertiary);}
.spinner{width:48px;height:48px;animation:spin 1s steps(8) infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.kb{position:absolute;left:0;top:231.1px;width:480px;height:233px;z-index:50;}
.kb-row{position:absolute;left:var(--kb-x);width:var(--kb-w);height:var(--kb-h);display:flex;gap:var(--kb-gap);}
.kb-r1{top:0}.kb-r2{top:61.65px;justify-content:center}.kb-r3{top:123.29px}.kb-r4{top:184.94px}
.kbk{height:var(--kb-h);width:var(--kb-key);border-radius:var(--r-icon);background:#55555A;
  color:#ECECF0;font-size:24px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;flex:none;transition:background .08s,transform .08s;}
.kbk:active{background:#7A7A80;transform:scale(.94);}
.kbk.mod{width:57.87px;background:var(--gray-5);}
.kbk.abc{width:90px;background:var(--gray-5);font-size:20px;}
.kbk.space{flex:1;background:#55555A;}
.kbk.go{width:90px;background:var(--btn-default);color:#fff;font-size:26px;}
.kbk.go.off{background:var(--btn-disabled);color:var(--btn-disabled-text);cursor:not-allowed;}
.kbk.go.off:active{transform:none;}
.field{position:absolute;left:24px;width:432px;display:flex;align-items:center;justify-content:space-between;}
.field .val{font-size:30px;line-height:1.4;color:var(--text-white-solid);letter-spacing:.02em;white-space:nowrap;overflow:hidden;}
.field .val.ph{color:var(--text-secondary);letter-spacing:0;}
.caret{display:inline-block;width:2px;height:30px;background:var(--btn-default);vertical-align:-5px;margin-left:2px;animation:blink 1.05s steps(1) infinite;}
@keyframes blink{50%{opacity:0}}
.divider{position:absolute;left:24px;width:432px;height:1px;background:var(--gray-5);}
.onphone{position:absolute;left:24px;display:flex;align-items:center;gap:8px;font-size:22px;color:var(--btn-default);cursor:pointer;}
.progress-wrap{position:absolute;left:16px;top:358px;}
.mosaic{display:grid;gap:0;}.mosaic i{display:block;}
/* 教学 */
.g-label .k,.g-label .v{position:absolute;left:30px;line-height:1.4;text-box-trim:trim-both;text-box-edge:cap alphabetic;}
.g-label .k{top:64px;font-size:24px;color:var(--btn-default);}
.g-label .v{top:97px;font-size:40px;color:#fff;}
.dev-box{position:absolute;overflow:hidden;}
.dev-fade{position:absolute;left:-2px;right:-2px;pointer-events:none;z-index:1;}
.dev-fade.b{background:linear-gradient(to top,#060606 0%,rgba(24,24,25,0) 108.14%);}
.dev-fade.t{background:linear-gradient(to bottom,#060606 0%,rgba(24,24,25,0) 108.14%);}
.dev-bar{position:absolute;background:var(--text-secondary);border-radius:2px;z-index:2;animation:bar-in 1.9s ease both infinite;}
@keyframes bar-in{0%{opacity:0}12%{opacity:1}84%{opacity:1}100%{opacity:0}}
.gest{position:absolute;}
@keyframes g-down{0%{transform:translateY(0);opacity:0}10%{opacity:1}70%{transform:translateY(56px);opacity:1}100%{transform:translateY(56px);opacity:0}}
@keyframes g-up{0%{transform:translateY(0);opacity:0}10%{opacity:1}70%{transform:translateY(-56px);opacity:1}100%{transform:translateY(-56px);opacity:0}}
@keyframes g-right{0%{transform:translateX(0);opacity:0}10%{opacity:1}70%{transform:translateX(72px);opacity:1}100%{transform:translateX(72px);opacity:0}}
@keyframes g4-hand{0%{transform:translateX(0);opacity:0}5%{opacity:1}24%{transform:translateX(-28px)}30%{transform:translateX(-28px)}62%{transform:translateX(40px)}86%{transform:translateX(40px);opacity:1}100%{transform:translateX(40px);opacity:0}}
@keyframes g4-l{0%{transform:translateX(0);opacity:0}5%{opacity:1}24%{transform:translateX(-28px);opacity:1}34%{transform:translateX(-28px);opacity:0}100%{transform:translateX(-28px);opacity:0}}
@keyframes g4-r{0%{transform:translateX(0);opacity:0}26%{transform:translateX(0);opacity:0}30%{transform:translateX(0);opacity:1}62%{transform:translateX(40px);opacity:1}86%{transform:translateX(40px);opacity:1}100%{transform:translateX(40px);opacity:0}}
.g-down{animation:g-down 1.9s var(--ease-push) infinite}
.g-up{animation:g-up 1.9s var(--ease-push) infinite}
.g-right{animation:g-right 1.9s var(--ease-push) infinite}
.g4-hand{animation:g4-hand 2.6s ease-in-out infinite}
.g4-l{animation:g4-l 2.6s ease-in-out infinite}
.g4-r{animation:g4-r 2.6s ease-in-out infinite}
@keyframes btn-in{0%{opacity:0;transform:translateY(24px) scale(.84)}35%{opacity:1}100%{opacity:1;transform:none}}
.btn-delayed{animation:btn-in .5s var(--ease-overshoot) 2.6s both;}
.k-note{position:absolute;}
.k-note .k,.k-note .v{position:absolute;line-height:1.4;white-space:nowrap;text-box-trim:trim-both;text-box-edge:cap alphabetic;}
.k-note .k{left:0;top:0;font-size:18px;color:var(--btn-default);}
.k-note .k.ind{left:36px;}
.k-note .v{left:0;top:23px;font-size:24px;color:#fff;}
.k-ind{position:absolute;left:0;top:0;width:32px;height:12px;border-radius:6px;}
.k-ind.dot{width:12px;background:var(--btn-default);}
.k-ind.bar{width:32px;background:var(--btn-default);}

/* ============================================================
   模块二 · 系统功能
   ============================================================ */
@keyframes icon-pop{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
@keyframes card-up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
/* 仅解锁时播放；左右翻页走整屏平移，图标不再单独弹跳 */
.unlock .wx-card{animation:card-up .26s ease-out both;}
.unlock .app{animation:icon-pop .30s var(--ease-overshoot) both;}
.unlock .st-bar{animation:fade-in .24s ease .12s both;}
/* 状态栏：时间 24 MNE Medium（Figma 2:427 宽 61 反推） */
.st-bar{position:absolute;left:0;top:0;width:480px;height:48px;z-index:40;}
.st-time{position:absolute;left:24px;top:6px;font-family:var(--font-display);font-weight:500;
  font-size:24px;line-height:36px;color:var(--text-white-solid);letter-spacing:.01em;}
.st-icons{position:absolute;left:216px;top:0;width:240px;height:48px;display:flex;}
.st-icons>span{width:48px;height:48px;display:block;}
/* 天气卡 · Figma 2:455 —— 底 #3B3C3D / 圆角 40；文字全部 Maison Neue Ext */
.wx-card{position:absolute;left:13px;top:66px;width:454px;height:209px;
  background:#242425;border-radius:var(--r-page);overflow:hidden;}   /* Figma 2:455 已由 #3B3C3D 调整为 #242425 */
/* Figma 2:479/2:480：flex 列，29° 与 Cloudy 之间 gap 12，Cloudy 与 Shanghai 之间 0 */
.wx-text{position:absolute;left:20.98px;top:32.99px;width:146px;
  display:flex;flex-direction:column;align-items:flex-start;font-family:var(--font-display);}
.wx-temp,.wx-desc,.wx-city{white-space:nowrap;}
/* 数字 95px，° 85px（同基线，同字重） */
.wx-temp{font-weight:400;font-size:95px;line-height:1;color:var(--text-white-solid);
  text-box-trim:trim-both;text-box-edge:cap alphabetic;margin-bottom:12px;}
.wx-temp em{font-style:normal;font-size:85px;}
.wx-desc{font-weight:400;font-size:24px;line-height:1.4;color:var(--text-white-solid);}
.wx-city{font-weight:300;font-size:18px;line-height:1.4;color:var(--btn-default);}

/* 时钟 · Figma 2:456 底板 169 r24 #EDEFF2 ／ 2:457 表盘 ⌀155.815 居中
   指针长度=圆心到针尖，旋转中心=圆心，0°=12 点，顺时针为正 */
.clock{position:absolute;left:262px;top:20px;width:169px;height:169px;
  border-radius:var(--r-card-l);background:var(--gray-1);overflow:hidden;}
.dial{position:absolute;left:6.59px;top:7.18px;width:155.815px;height:155.815px;border-radius:77.908px;}
.dial .tk{position:absolute;left:50%;top:0;width:2px;height:8px;margin-left:-1px;
  background:var(--gray-3);transform-origin:50% 77.908px;}
.dial .tk.q{width:3px;margin-left:-1.5px;height:11px;background:var(--gray-4);}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:0;}

const SVG_COLOR={chevron:'#B4B6BA',left:'#B4B6BA',refresh:'#B4B6BA',lock:'#B4B6BA',
  eye:'#909295',eyeOff:'#909295',loading:'#D6D6DE',wifiBar:'#91919B',no:'#FF4C01',yes:'#FCFCFF'};
function svg(name,{w,h,color,cls='',style=''}={}){
  let s=SVGS[name];if(!s)return '';
  // p2 图标统一用 #F9FAFB，素材/ 的多为 #FCFCFF —— 两种都替换
  if(color){ if(SVG_COLOR[name])s=s.split(SVG_COLOR[name]).join(color);
    else s=s.replace(/#FCFCFF/gi,color).replace(/#F9FAFB/gi,color); }
  if(w!=null)s=s.replace(/width="[^"]*"/,`width="${w}"`);
  if(h!=null)s=s.replace(/height="[^"]*"/,`height="${h}"`);
  if(cls||style)s=s.replace('<svg ',`<svg class="${cls}" style="${style}" `);
  return s;
}
const png=(n,{w,h,style=''}={})=>`<img src="${PNGS[n]}" ${w?`width="${w}"`:''} ${h?`height="${h}"`:''} style="${style}" alt="">`;

/* 加载进度马赛克条 */
const PC=32,PR=5,PCELL=9,PGAP=3;
function progressBarHTML(){let h=`<div class="mosaic" id="progGrid" style="grid-template-columns:repeat(${PC},${PCELL}px);gap:${PGAP}px">`;
  for(let y=0;y<PR;y++)for(let x=0;x<PC;x++)h+=`<i data-col="${x}" style="width:${PCELL}px;height:${PCELL}px;background:#242426"></i>`;
  return h+'</div>';}
function setProgress(root,p){const f=Math.round(p*PC);
  root.querySelectorAll('#progGrid i').forEach(i=>i.style.background=(+i.dataset.col<f)?'#EB4126':'#242426');}

function topbar({left='',title='',right=''}={}){return `<div class="topbar">
  <div class="tb-side ${left?'':'hidden'}" data-act="tb-left">${left}</div>
  <div class="tb-title">${title}</div>
  <div class="tb-side ${right?'':'hidden'}" data-act="tb-right">${right}</div></div>`;}

/* ---------- S2 Wi-Fi 扫描 + 列表 · 535:5680 / 544:6675 ---------- */
Screens.wifi = {name:'S2 Wi-Fi 列表', render:()=>`
  ${topbar({right:SKIP_RIGHT})}
  <div class="title" style="top:64px">Connect to<br>Network</div>
  <div id="spin" style="position:absolute;left:263px;top:112px"><div class="spinner">${ICON.loading()}</div></div>
  <div id="refreshIcon" style="position:absolute;left:263px;top:112px;opacity:0;transition:opacity .3s;cursor:pointer">${ICON.refresh()}</div>
  <div class="wifi-panel" id="panel" style="opacity:0;transform:translateY(24px)">
    <div class="wifi-scroll" id="wscroll"></div>
  </div>
  <div class="scrollbar" id="sbar" style="top:200px;height:100px;opacity:0"></div>`,
  mount(r){
    r.querySelector('[data-act=tb-right]').onclick=()=>Flow.skipWifi();
    const panel=r.querySelector('#panel'), scroll=r.querySelector('#wscroll');
    const spin=r.querySelector('#spin'), refresh=r.querySelector('#refreshIcon'), sbar=r.querySelector('#sbar');

    // 扫描 → 出结果（真实由驱动回调，这里模拟 900ms）
    setTimeout(()=>{
      scroll.innerHTML = NETWORKS.map((n,i)=>`
        <div class="wifi-row" data-i="${i}">
          <div class="ssid">${n.ssid}</div>
          <div class="icons">${n.lock?ICON.lock():''}${ICON.wifi(n.lv)}</div>
        </div>`).join('') +
        `<div class="wifi-row other" data-other="1"><div class="ssid">Other...</div></div>`;
      panel.style.transition='opacity .34s ease, transform .45s cubic-bezier(0.34,1.56,0.64,1)';
      panel.style.opacity='1'; panel.style.transform='none';
      sbar.style.opacity='.55';

      scroll.querySelectorAll('[data-i]').forEach(row=>row.onclick=()=>{
        const n=NETWORKS[+row.dataset.i]; S.ssid=n.ssid; S.password='';
        if(!n.lock){ Flow.connect(); } else { Flow.go('pwd'); }
      });
      scroll.querySelector('[data-other]').onclick=()=>Flow.go('other');

      // 滚动条跟随
      scroll.onscroll=()=>{
        const ratio=scroll.scrollTop/(scroll.scrollHeight-scroll.clientHeight||1);
        const track=280-100; sbar.style.top=(200+ratio*track)+'px';
      };
    },900);

    // 扫描完成 spinner → refresh
    setTimeout(()=>{spin.style.transition='opacity .3s';spin.style.opacity='0';refresh.style.opacity='1';},2200);
    refresh.onclick=()=>Flow.go('wifi',{dir:'fade'});
  }};

/* ---------- S7 绑定加载（真实进度，3s）· 535:5372/5382/5392 ---------- */
// 分阶段任务；每段有真实耗时，进度由任务回调驱动，固件端可直接替换 runner
const BIND_STAGES = [
  {label:'Verifying device…', ms:1000},
  {label:'Syncing account…',  ms:1200},
  {label:'Almost there…',     ms:800 },
];
Screens.loading = {name:'S7 绑定加载', render:()=>`
  <div style="position:absolute;left:16px;top:206px;font-family:var(--font-display);font-size:56px;
       font-weight:600;line-height:1.06;color:#fff;letter-spacing:-.015em">Connecting To<br>Claw…</div>
  <div id="stageLabel" style="position:absolute;left:16px;top:330px;font-size:22px;color:var(--btn-default)">${BIND_STAGES[0].label}</div>
  <div class="progress-wrap">${progressBarHTML()}</div>`,
  mount(r){
    let cancelled=false;
    Flow._cancelTask=()=>cancelled=true;
    const total=BIND_STAGES.reduce((a,s)=>a+s.ms,0);
    let done=0;
    (async()=>{
      for(const st of BIND_STAGES){
        if(cancelled)return;
        r.querySelector('#stageLabel').textContent=st.label;
        const t0=performance.now();
        await new Promise(res=>{
          const tick=()=>{
            if(cancelled)return res();
            const e=Math.min(performance.now()-t0,st.ms);
            setProgress(r,(done+e)/total);          // ← 真实进度：由已完成量驱动
            e>=st.ms ? res() : requestAnimationFrame(tick);
          };requestAnimationFrame(tick);});
        done+=st.ms;
      }
      if(cancelled)return;
      S.clawLinked=true;
      Flow.go('success',{dir:'fade'});
    })();
  }};

//   g2/g3/g4 用「教学2」= 设备底部，底对齐、顶部渐隐
// 坐标系：bar 相对设备图；arr 相对容器；hand 相对整屏（可溢出设备框）
// 排布规则：箭头起点贴移动杆内侧；手放在箭头下方并横向错开，不遮箭头
const GESTURES = {
  g1:{kicker:'Swipe down', title:'Open Control Center', img:'guideTop', iw:269,ih:180,
      x:105.7,y:185.24, bw:268.55,bh:173.689, fade:{edge:'b',h:90.85,y:82.84},
      bar:{x:108.5,y:27,w:52,h:4},          // 杆下沿 y=31

      bar:{x:108.5,y:146,w:52,h:4},         // 图内 y=146 → 容器 y=139.7
      arrows:[{x:94.5,y:82.2,w:80,rot:-90,anim:'g-up'}],   // 箭尾贴杆上沿，指向上

              {x:130,y:55.2,w:80,rot:0,  anim:'g4-r'}],   // 大箭头偏右，右滑 40 → 最右 250
      hand:{x:206,y:280}, anim:'g4-hand', last:true},

function gestureScreen(id){
  const g=GESTURES[id];
  const f=g.fade;
  return {name:`${id.toUpperCase()} ${g.title}`, render:()=>`
    <div class="g-label"><div class="k">${g.kicker}</div><div class="v">${g.title}</div></div>
    <!-- 设备图（被渐变淡入黑底）＋ 移动杆与箭头（在渐变之上，不被吃掉） -->
    <div class="dev-box" style="left:${g.x}px;top:${g.y}px;width:${g.bw}px;height:${g.bh}px">
      <div style="position:absolute;left:0;${g.imgBottom?'bottom:0':'top:0'};width:${g.iw}px;height:${g.ih}px">

      </div>
      <div class="dev-fade ${f.edge}" style="top:${f.y}px;height:${f.h}px"></div>
      ${g.arrows.map(a=>`<div class="gest ${a.anim}" style="left:${a.x}px;top:${a.y}px;z-index:2">
        <div style="transform:rotate(${a.rot}deg)">${ICON.arrow(a.w)}</div>
      </div>`).join('')}
    </div>
    <!-- 手在屏幕级图层，压在渐变之上（Figma 535:5501，倾斜 -9.23°）
         外层负责位移动画，内层负责固定倾角，避免 transform 互相覆盖 -->
    <div class="gest ${g.anim}" style="left:${g.hand.x}px;top:${g.hand.y}px;z-index:3">
      <div style="transform:rotate(-9.23deg)">${ICON.hand(69)}</div>
    </div>
    ${g.last
      ? `<div class="pill primary btn-delayed" data-act="start" style="position:absolute;left:64px;top:356px;width:354px;height:88px;z-index:4">Get Started!</div>`
      : `<div class="skipguide" data-act="skip">Skip Guide ${ICON.chevron('#909295')}</div>`}
    <div style="position:absolute;inset:0;z-index:1" data-act="next"></div>`,
    mount(r){
      r.querySelector('[data-act=next]').onclick=()=>{ if(!g.last) Flow.go(g.next); };
      const sk=r.querySelector('[data-act=skip]');   // g4 用 Get Started 取代 Skip Guide
      if(sk) sk.onclick=(e)=>{e.stopPropagation();Flow.go('lockScreen',{dir:'fade'});};
      const s=r.querySelector('[data-act=start]');
      if(s){ s.style.zIndex=5; s.onclick=(e)=>{e.stopPropagation();Flow.go('lockScreen',{dir:'fade'});}; }
    }};
}

   ============================================================ */
const KB_R1='qwertyuiop', KB_R2='asdfghjkl', KB_R3='zxcvbnm';
function keyboardHTML(canGo){
  const key=(c)=>`<div class="kbk" data-k="${c}">${S.shift?c.toUpperCase():c}</div>`;
  return `<div class="kb">
    <div class="kb-row kb-r1">${[...KB_R1].map(key).join('')}</div>
    <div class="kb-row kb-r2" style="gap:var(--kb-gap)">${[...KB_R2].map(key).join('')}</div>
    <div class="kb-row kb-r3">
      <div class="kbk mod" data-k="__shift">${ICON.shift()}</div>
      <div style="display:flex;gap:var(--kb-gap)">${[...KB_R3].map(key).join('')}</div>
      <div class="kbk mod" data-k="__del">${ICON.del()}</div>
    </div>
    <div class="kb-row kb-r4">
      <div class="kbk abc" data-k="__abc">ABC</div>
      <div class="kbk space" data-k=" "></div>
      <div class="kbk go ${canGo?'':'off'}" data-k="__go">→</div>
    </div>
  </div>`;
}
function bindKeyboard(root,{get,set,submit}){
  root.querySelectorAll('.kbk').forEach(k=>{
    k.onclick=()=>{
      const c=k.dataset.k;
      if(c==='__shift'){S.shift=!S.shift;Flow.rerender();return;}
      if(c==='__del'){set(get().slice(0,-1));return;}
      if(c==='__abc'){Flow.toast('数字/符号键盘：待补设计');return;}
      if(c==='__go'){submit();return;}
      let ch=c; if(S.shift&&/[a-z]/.test(c)){ch=c.toUpperCase();S.shift=false;}
      set(get()+ch);
    };
  });
}

/* ---------- 时钟组件（可直接照搬到固件的参考实现） ----------
   几何：底板 169 r24 #EDEFF2；表盘 ⌀155.815 居中；圆心即旋转中心
   指针（长度 = 圆心→针尖，无圆角）：
     时针 42×3.5 #FF4C01 ／ 分针 58×3 #181819 ／ 秒针 78×2 #909295
   角度：0° = 12 点方向，顺时针为正
     时 = (h%12)*30 + m*0.5   分 = m*6 + s*0.1   秒 = s*6（整秒步进）  */
function clockHTML(){
  let ticks='';
  for(let i=0;i<12;i++) ticks+=`<div class="tk ${i%3===0?'q':''}" style="transform:rotate(${i*30}deg)"></div>`;
  return `<div class="clock"><div class="dial">${ticks}
    <div class="hand hr"></div><div class="hand hm"></div><div class="hand hs"></div>
    <div class="pivot"></div></div></div>`;
}
const Clock={timer:null,
  start(root){
    clearInterval(this.timer);
    const draw=()=>{
      if(!root.isConnected){clearInterval(this.timer);return;}
      const d=new Date(), h=d.getHours(), m=d.getMinutes(), s=d.getSeconds();
      const set=(sel,deg)=>{const n=root.querySelector(sel);if(n)n.style.transform=`rotate(${deg}deg)`;};
      set('.hr',(h%12)*30+m*0.5);
      set('.hm',m*6+s*0.1);
      set('.hs',s*6);                                  // 整秒步进（1Hz）
      const t=root.querySelector('.st-time');
      if(t)t.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    };
    draw(); this.timer=setInterval(draw,1000);
  }};

function appHTML(k,n){return `<div class="app" data-k="${k}" data-n="${n}"><i>${png(k,{w:118,h:118})}</i><b>${n}</b></div>`;}
/* 只有从熄屏页解锁进来才播放入场；翻页进来不播（Flow._unlocking 一次性标记） */
function stagger(r){
  if(!Flow._unlocking) return;
  Flow._unlocking=false;
  r.classList.add('unlock');
  r.querySelectorAll('.app').forEach((a,i)=>a.style.animationDelay=(110+i*30)+'ms');
  const c=r.querySelector('.wx-card'); if(c)c.style.animationDelay='80ms';
}

/* 亮度 / 音量竖条
   图标三档：0 = 关（灰）／1–50 = 半 ／ 51–100 = 满 */
function vbarIcon(key,v){
  if(key==='volume') return v===0?'soundOff':(v<=50?'soundLow':'sound');
  // 亮度三档：<50 空心 sun-off ／ 50–99 半实 sun-semi ／ 满值 实心 sun
  return v>=100?'sun':(v>=50?'sunSemi':'sunOff');
}
/* 图标固定在 top:132（Figma 22:2841 / 22:2854）。填充自底部上涨，
   涨过图标顶端(204-132=72px，即 35%)时图标转深色，否则用浅色 */
function vbarColor(key,v){
  if(v===0) return '#5A5A60';                  // 关闭：灰
  return v>=35 ? '#FF4C01'                     // 落在浅色填充上 → 主题橙（亮度/音量统一）
               : '#F9FAFB';                    // 仍在深色轨道上 → 浅色
}
function vbarHTML(key,x){
  const v=S[key];
  return `<div class="vbar" data-k="${key}" style="left:${x}px;top:256px">
    <div class="fill" style="height:${v*2.04}px"></div>
    <div class="ic">${svg(vbarIcon(key,v),{w:48,h:48,color:vbarColor(key,v)})}</div>
  </div>`;
}
/* 竖条拖动 */
function vbar(node,key){
  if(!node)return;
  const set=(e)=>{const b=node.getBoundingClientRect();
    let v=Math.round((1-(e.clientY-b.top)/b.height)*100);
    S[key]=Math.max(0,Math.min(100,v));
    const val=S[key];
    node.querySelector('.fill').style.height=(val*2.04)+'px';
    node.querySelector('.ic').innerHTML =                     // 拖动时同步换图标与配色
      svg(vbarIcon(key,val),{w:48,h:48,color:vbarColor(key,val)});};
  node.addEventListener('pointerdown',e=>{node.setPointerCapture(e.pointerId);set(e);
    node.onpointermove=set;});
  node.addEventListener('pointerup',()=>node.onpointermove=null);
}

const barsOf=v=>Math.max(0,Math.min(SL_N,Math.round(v/100*SL_N)));

/* ============================================================
   手势
   ============================================================ */
function Gesture(node,{up,down,left,right,edgeRight}={}){
  let sx=0,sy=0,ex=0,t0=0,on=false;
  node.addEventListener('pointerdown',e=>{
    if(e.target.closest('.sl-track,.vbar,.toggle,.scroll,.kb,.wifi-scroll,.pill,.tog,.circ'))return;
    sx=e.clientX;sy=e.clientY;ex=e.offsetX;t0=Date.now();on=true;});
  node.addEventListener('pointerup',e=>{
    if(!on)return;on=false;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Date.now()-t0>900)return;
    if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>40){dy<0?up&&up():down&&down();return;}
    if(Math.abs(dx)>40){ if(dx>0&&ex<60&&edgeRight){edgeRight();return;} dx<0?left&&left():right&&right(); }});
}

/* ============================================================
   路由
   ============================================================ */
const Flow={
  cur:null,curEl:null,prevId:null,_toast:null,_cancelTask:null,
  go(id,{dir='push'}={}){
    const sc=Screens[id];if(!sc)return;
    if(this._cancelTask){this._cancelTask();this._cancelTask=null;}
    const screen=$('#screen');
    const next=el(`<div class="view">${sc.render()}</div>`);
    const prev=this.curEl;
    const map={push:['a-push-in','a-push-out'],pop:['a-pop-in','a-pop-out'],
      fade:['a-fade-in','a-fade-out'],dlg:['a-dlg-in','a-fade-out'],
      cc:['a-cc-in','a-fade-out'],ccOut:['a-fade-in','a-cc-out'],unlock:['a-fade-in','a-lock-out'],
      insR:['a-ins-r','a-fade-out'],insL:['a-ins-l','a-fade-out']};
    const [ein,eout]=sc.dialog&&dir==='push'?map.dlg:(map[dir]||map.push);
    next.classList.add(ein);
    screen.insertBefore(next,$('.glare'));
    sc.mount(next);
    if(prev){prev.classList.add(eout);setTimeout(()=>prev.remove(),460);}
    const pi=PAGES.indexOf(id); if(pi>=0)S.page=pi;   // 记住当前桌面页，收起控制中心时回到原页
    this.cur=id;this.curEl=next;this.syncNav();
  },
  rerender(){const sc=Screens[this.cur];
    const next=el(`<div class="view">${sc.render()}</div>`);
    $('#screen').insertBefore(next,$('.glare'));sc.mount(next);
    this.curEl&&this.curEl.remove();this.curEl=next;},
  async connect(){this.toast('Connecting…',900);await wait(950);
    if(!PWD_OK(S.password)){S.failReason='Incorrect password';this.go('fail',{dir:'fade'});return;}
    if(S._pwdReturn==='wlan'){                     // 来自系统 WLAN 列表 → 连上后回列表
      S._pwdReturn=null;S.curSSID=S.ssid;S.wlanConnected=true;S.wlanOn=true;S.wifi=true;
      this.toast('已连接 '+S.ssid);this.go('wlan',{dir:'pop'});return;}
    S.wifiConnected=true;this.go('claw');},        // 初始化流程 → 继续龙虾绑定
  skipWifi(){S.wifiConnected=false;this.go('guideIntro');},
  unlock(){this._unlocking=true;this.go('home',{dir:'unlock'});},
  back(){
    const m={pwd:'wifi',other:'wifi',otherName:'other',otherPwd:'other',qrwifi:'pwd',claw:'wifi',
      guideKeys:'guideIntro',g1:'guideKeys',g2:'g1',g3:'g2',g4:'g3',
      wlan:'cc',wlanDetail:'wlan',display:'settings',settings:'home',cc:'home',
      apps:'home',apps2:'apps',insert:'home'};
    const t=m[this.cur];t?this.go(t,{dir:'pop'}):this.toast('已在流程起点');},
  restart(){Object.assign(S,{lang:'en',ssid:null,password:'',shownPassword:false,shift:true,
    wifiConnected:false,clawLinked:false,otherSSID:'',otherPwd:'',slots:{L:null,R:null}});
    this.go('lang',{dir:'fade'});},
  toast(msg,ms=1500){if(this._toast)this._toast.remove();
    const t=el(`<div class="toast">${msg}</div>`);
    $('#screen').insertBefore(t,$('.glare'));this._toast=t;
    setTimeout(()=>{t.style.animation='fade-out .2s ease both';setTimeout(()=>t.remove(),220);},ms);},
  overlay(html,ms=1500){const o=el(`<div class="overlay">${html}</div>`);
    $('#screen').insertBefore(o,$('.glare'));
    setTimeout(()=>{o.style.animation='fade-out .2s ease both';setTimeout(()=>o.remove(),210);},ms);},
  syncNav(){$$('.panel button[data-id]').forEach(b=>b.classList.toggle('on',b.dataset.id===this.cur));
    if(typeof openAccFor==='function')openAccFor(this.cur);}
};

/* 子板插入事件 */
const Insert={async fire(side){
  const b=$('#boardSel').value;
  S.slots[side]=b;S._insSide=side;S._insBoard=b;
  const fx=el(`<div class="ins-fx ${side==='R'?'r':'l'}"></div>`);
  $('#screen').insertBefore(fx,$('.glare'));
  const d=side==='R'?'r':'l';
  fx.style.animation=`fx-in-${d} .26s cubic-bezier(.22,1,.36,1) both`; await wait(260);
  fx.style.animation='fx-blink .22s ease-in-out both';                 await wait(220);
  fx.style.animation=`fx-out-${d} .24s cubic-bezier(.55,0,.85,.3) both`;await wait(240);
  fx.remove(); await wait(90);
  Flow.prevId=Flow.cur;
  Flow.go('insert',{dir:side==='R'?'insR':'insL'});}};   // 从插入侧弹入

/* 音乐小球：匀速 3s/圈，暂停保留角度 */
const Ball={node:null,raf:null,last:0,
  attach(n){this.node=n;this.last=performance.now();cancelAnimationFrame(this.raf);this.tick();},
  tick(){const now=performance.now(),dt=now-this.last;this.last=now;
    if(S.playing)S.ballAngle=(S.ballAngle+dt/3000*360)%360;
    if(this.node&&this.node.isConnected)this.node.style.transform=`rotate(${S.ballAngle}deg)`;
    this.raf=requestAnimationFrame(()=>this.tick());}};

/* ---------- 物理按键 ---------- */
function bindKey(n,{tap,hold,holdMs=600}){let tm=null,held=false;
  n.addEventListener('pointerdown',e=>{n.setPointerCapture(e.pointerId);held=false;n.classList.add('pressed');
    tm=setTimeout(()=>{held=true;hold&&hold();},holdMs);});
  n.addEventListener('pointerup',()=>{clearTimeout(tm);n.classList.remove('pressed');if(!held)tap&&tap();});
  n.addEventListener('pointercancel',()=>{clearTimeout(tm);n.classList.remove('pressed');});}
bindKey($('#keyTop'),{tap:()=>Flow.back(),
  hold:()=>Flow.overlay(`${ICON.mic()}<div style="font-size:26px;color:#fff">Chat with Claw</div>
    <div style="font-size:18px;font-weight:300;color:var(--text-secondary)">长按主键唤起 · 本期不实现</div>`,1800)});
bindKey($('#keyPower'),{tap:()=>Flow.go('lockScreen',{dir:'fade'}),
  hold:()=>Flow.overlay(`${ICON.power()}<div style="font-size:26px;color:#fff">Power Off</div>`,1600)});
bindKey($('#keyReset'),{tap:()=>Flow.restart()});

/* ---------- 调试面板 ---------- */
const NAV1=['lang','wifi','pwd','other','otherName','otherPwd','qrwifi','fail','claw','loading','success',
  'guideIntro','guideKeys','g1','g2','g3','g4','lockScreen'];
const NAV2=['home','apps','apps2','cc','wlan','wlanDetail','settings','display','insert'];
$('#nav1').innerHTML=NAV1.map(i=>`<button data-id="${i}">${Screens[i].name}</button>`).join('');
$('#nav2').innerHTML=NAV2.map(i=>`<button data-id="${i}">${Screens[i].name}</button>`).join('');
$$('.panel button[data-id]').forEach(b=>b.onclick=()=>Flow.go(b.dataset.id,{dir:'fade'}));
/* 折叠：手风琴，同时只展开一组 */
$$('.acc-h').forEach(h=>h.onclick=()=>{
  const me=h.parentElement, was=me.classList.contains('open');
  $$('.acc').forEach(a=>a.classList.remove('open'));
  if(!was)me.classList.add('open');});
// 跳转时自动展开当前屏所在的分组
const openAccFor=id=>{
  const g=NAV1.includes(id)?'1':NAV2.includes(id)?'2':null; if(!g)return;
  $$('.acc').forEach(a=>a.classList.toggle('open',a.dataset.acc===g));};
$('#boardSel').innerHTML=Object.entries(BOARDS).map(([k,v])=>`<option value="${k}">${v.short}</option>`).join('');
$$('[data-zoom]').forEach(b=>b.onclick=()=>{$$('[data-zoom]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  $('#deviceWrap').style.transform=`scale(${b.dataset.zoom})`;
  $('#deviceWrap').style.marginBottom=`${(b.dataset.zoom-1)*561}px`;});

/* ---------- 字体自检 ---------- */
const FC=document.createElement('canvas').getContext('2d');
const PROBE='ABCDEFGHIJKLM0123456789';
function hasFont(f,w=400){FC.font=`${w} 48px monospace`;const b=FC.measureText(PROBE).width;
  FC.font=`${w} 48px "${f}", monospace`;if(Math.abs(FC.measureText(PROBE).width-b)>.5)return true;
  FC.font=`${w} 48px serif`;const b2=FC.measureText(PROBE).width;
  FC.font=`${w} 48px "${f}", serif`;return Math.abs(FC.measureText(PROBE).width-b2)>.5;}
(function(){const rows=[['标题 Demi','MNE',600],['数字 Medium','MNE',500],['标题 Book','MNE',400],
  ['正文 Regular','HN',400],['细体 Light','HN',300]];
  let miss=0;
  $('#fontCheck').innerHTML=rows.map(([l,f,w])=>{const ok=hasFont(f,w);if(!ok)miss++;
    return `<span style="color:${ok?'#63C270':'#FF6B4A'}">${ok?'✓':'✗'} ${l}</span>`;}).join('');
  const found=['Maison Neue Ext','Maison Neue Ext Book','Maison Neue Ext Medium','Maison Neue Ext Demi',
    'Helvetica Neue','Helvetica Neue Light'].filter(n=>hasFont(n));
  $('#fontFound').innerHTML= miss
    ? `<span style="color:#FF6B4A">${miss} 档未挂上</span> · 本机识别到：${found.join('、')||'（无）'} —— 把这些名字发我补进 @font-face`
    : `本机识别到：${found.join('、')}`;
  })();

Flow.go('lang',{dir:'fade'});
</script>
