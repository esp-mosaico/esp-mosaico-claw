## Mosaic/GSP system UI backed by the shared display_service presenter.
dependencies:
  idf: ">=6.2"
  display_service:
    path: ../display_service
  audio_hub:
    path: ../../third-party/esp-claw/components/common/audio_hub
  audio_playback:
    path: ../../third-party/esp-claw/components/common/audio_playback
  asr_service:
    path: ../asr_service
  cap_im_ai_create:
